    <p>Opening SynthCity…</p>
    <script>
      const destination = new URL('/design-review/square-grid-mayor.html', window.location.origin);
      const source = new URL(window.location.href);
      source.searchParams.forEach((value, key) => destination.searchParams.append(key, value));
      destination.searchParams.set('profile', 'city');
      destination.hash = source.hash;
      window.location.replace(destination);
    </script>
